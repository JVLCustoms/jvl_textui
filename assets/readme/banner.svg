<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="JVL TextUI — interaction prompts for FiveM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04070c"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9eef5"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.02" stop-color="#0b2545" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#0b2545"/>
      <stop offset="0.32" stop-color="#0ea5e9"/>
      <stop offset="0.44" stop-color="#e9eef5"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="0.92" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a1018" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#0a1018" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0a1018" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef5"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .orb { animation: drift 9s ease-in-out infinite alternate; }
      .orb2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .slide { animation: slide 4s ease-in-out infinite; }
      .slide2 { animation: slide 4s ease-in-out 1.3s infinite; }
      .blink { animation: pulse 2.4s ease-in-out infinite; }
      .title { font: 800 76px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1.5px; }
      .sub { font: 500 23px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #bae6fd; }
      .chip { font: 600 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e0f2fe; }
      .prompt { font: 500 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #eef3f9; }
      .key { font: 700 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #04121f; }
      @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,-30px); } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes slide { 0%, 100% { transform: translateX(0); opacity: 1; } 45% { transform: translateX(0); opacity: 1; } 55% { transform: translateX(-14px); opacity: 0; } 65% { transform: translateX(14px); opacity: 0; } 75% { transform: translateX(0); opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle class="orb" cx="930" cy="170" r="260" fill="url(#glow)"/>
  <circle class="orb2" cx="120" cy="330" r="200" fill="url(#glow)" opacity="0.6"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#line)"/>

  <!-- Key cap icon -->
  <g transform="translate(72,84)">
    <rect x="0" y="0" width="54" height="54" rx="12" fill="url(#cap)"/>
    <rect x="0" y="0" width="54" height="54" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" class="blink"/>
    <text x="27" y="37" text-anchor="middle" style="font: 800 26px 'Segoe UI', Arial, sans-serif; fill: #04121f">E</text>
  </g>

  <text class="title" x="146" y="140" fill="url(#txt)">JVL TextUI</text>
  <text class="sub" x="74" y="188">Interaction prompts in JVL Steel Blue, in the player's language.</text>

  <!-- Chips -->
  <g transform="translate(74,222)">
    <rect width="120" height="38" rx="19" fill="#0ea5e9" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text class="chip" x="60" y="24.5" text-anchor="middle">Key caps</text>
    <rect x="134" width="150" height="38" rx="19" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
    <text class="chip" x="209" y="24.5" text-anchor="middle">Auto language</text>
    <rect x="298" width="150" height="38" rx="19" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text class="chip" x="373" y="24.5" text-anchor="middle">Configurable</text>
    <rect x="462" width="132" height="38" rx="19" fill="#cbd5e1" fill-opacity="0.12" stroke="#cbd5e1" stroke-opacity="0.5"/>
    <text class="chip" x="528" y="24.5" text-anchor="middle">Standalone</text>
  </g>

  <!-- Prompt examples -->
  <g transform="translate(790,92)"><g class="slide">
    <rect width="340" height="58" rx="11" fill="url(#card)" stroke="#94c5e9" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="0" y="0" width="3" height="58" rx="1.5" fill="#38bdf8"/>
    <rect x="0" y="0" width="340" height="2" fill="url(#line)"/>
    <rect x="12" y="13" width="32" height="32" rx="9" fill="#0ea5e9" fill-opacity="0.2" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="58" y="16" width="26" height="26" rx="7" fill="url(#cap)"/>
    <text class="key" x="71" y="34" text-anchor="middle">E</text>
    <text class="prompt" x="94" y="35">Abrir el garaje</text>
  </g></g>
  <g transform="translate(790,180)"><g class="slide2">
    <rect width="340" height="58" rx="11" fill="url(#card)" stroke="#94c5e9" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="0" y="0" width="3" height="58" rx="1.5" fill="#38bdf8"/>
    <rect x="0" y="0" width="340" height="2" fill="url(#line)"/>
    <rect x="12" y="13" width="32" height="32" rx="9" fill="#0ea5e9" fill-opacity="0.2" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="58" y="16" width="26" height="26" rx="7" fill="url(#cap)"/>
    <text class="key" x="71" y="34" text-anchor="middle">H</text>
    <text class="prompt" x="94" y="35">Hotwire</text>
  </g></g>
</svg>
